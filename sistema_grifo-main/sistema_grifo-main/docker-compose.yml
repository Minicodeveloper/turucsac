version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: turuc_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: turucsac_db
    volumes:
      - db_data:/var/lib/mysql
      - ./turucsac_db_backup.sql:/docker-entrypoint-initdb.d/backup.sql
    ports:
      - "3307:3306"

  app:
    build:
      context: .
      dockerfile: Dockerfile-backend
    container_name: turuc_web
    restart: always
    volumes:
      - .:/var/www/html
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
